name: CI/CD Despliegue Blue-Green - Huellitas Felices

on:
  push:
    branches:
      - main # Ejecutar el pipeline cada vez que se haga push a la rama 'main'
  workflow_dispatch: # Permite ejecutar el pipeline manualmente

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Código 📦
        uses: actions/checkout@v4

      # ======================================================
      # CONFIGURACIÓN DE DOCKER BUILDX (Corrección del pipeline)
      # ======================================================
      - name: Set up Docker Buildx 🔨
        uses: docker/setup-buildx-action@v3

      # ======================================================
      # 1. AUTENTICACIÓN Y PUSH A DOCKER HUB
      # ======================================================
      - name: Iniciar sesión en Docker Hub 🐳
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y Empujar Imagen Docker 🛠️
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: karinasaenz/huellitas-felices-front:latest

      # ======================================================
      # 2. DESPLIEGUE REMOTO POR SSH
      # ======================================================
      - name: Configurar SSH Key para el Servidor 🔑
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # Carga la llave privada para que el sistema la use automáticamente
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          
      - name: Ejecutar Script de Despliegue Blue-Green en Servidor 🔄
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}  # IP o Dominio del servidor
          username: ${{ secrets.DEPLOY_USER }}  # Usuario SSH (debe ser 'root')
          pass: ${{ secrets.DEPLOY_PASSWORD }} 
      # Use the 'pass' parameter if you set a passphrase on your key
          script: |
            # 1. Navegar al directorio donde estan los archivos de despliegue
            cd /opt/huellitas-deployment
            
            # 2. Asegurarse de que el script sea ejecutable
            chmod +x deploy.sh
            
            # 3. Ejecutar el script 
            ./deploy.sh
